<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Equality — MathJax with TeX input</title>
    <!-- Requires internet access to load the MathJax renderer. -->
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-chtml.js"></script>
  </head>
  <body>
    <h1>Equality</h1>
    <p>One plus one is equal to two.</p>
    <p>Inline math: \(1 + 1 = 2\).</p>
    <p>Display math:</p>
    \[
      1 + 1 = 2
    \]
    <noscript>Enable JavaScript to render the TeX notation with MathJax.</noscript>
  </body>
</html>
