<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Equality — native MathML</title>
  </head>
  <body>
    <h1>Equality</h1>
    <p>One plus one is equal to two.</p>
    <!-- Native browser rendering: no MathJax or JavaScript needed. -->
    <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
      <mrow>
        <mn>1</mn>
        <mo>+</mo>
        <mn>1</mn>
        <mo>=</mo>
        <mn>2</mn>
      </mrow>
    </math>
  </body>
</html>
